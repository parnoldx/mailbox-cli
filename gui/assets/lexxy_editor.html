<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lexxy Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #181825;
    color: #CDD6F4;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 0;
    overflow-x: hidden;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 8px 14px;
    background: #1E1E2E;
    border-bottom: 1px solid #45475A;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .btn {
    background: transparent;
    border: 1px solid transparent;
    color: #CDD6F4;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.15s ease;
  }
  .btn:hover {
    background: #313244;
    border-color: #45475A;
    color: #89B4FA;
  }
  .btn.active {
    background: #89B4FA;
    color: #181825;
    font-weight: bold;
  }
  .divider {
    width: 1px;
    height: 18px;
    background: #45475A;
    margin: 0 4px;
  }
  .editor-content {
    min-height: 280px;
    padding: 16px;
    outline: none;
    color: #CDD6F4;
    font-size: 15px;
    line-height: 1.6;
  }
  .editor-content:empty:before {
    content: attr(placeholder);
    color: #6C7086;
    pointer-events: none;
  }
  h1, h2, h3 { color: #CDD6F4; margin: 12px 0 6px 0; }
  h1 { font-size: 22px; }
  h2 { font-size: 18px; }
  h3 { font-size: 16px; }
  p { margin-bottom: 10px; }
  ul, ol { margin-left: 20px; margin-bottom: 10px; }
  li { margin-bottom: 4px; }
  blockquote {
    border-left: 3px solid #89B4FA;
    padding-left: 12px;
    margin: 10px 0;
    color: #BAC2DE;
    font-style: italic;
  }
  pre, code {
    background: #1E1E2E;
    color: #A6E3A1;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 13px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  pre {
    padding: 10px;
    margin: 10px 0;
    overflow-x: auto;
  }
  a { color: #89B4FA; text-decoration: underline; }
  img { max-width: 100%; border-radius: 6px; margin: 8px 0; }
</style>
</head>
<body>

<div class="toolbar">
  <button class="btn" onclick="execCmd('bold')" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="btn" onclick="execCmd('italic')" title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="btn" onclick="execCmd('underline')" title="Underline (Ctrl+U)"><u>U</u></button>
  <button class="btn" onclick="execCmd('strikeThrough')" title="Strikethrough"><s>S</s></button>
  <div class="divider"></div>
  <button class="btn" onclick="execHeading('h2')" title="Heading 2">H2</button>
  <button class="btn" onclick="execHeading('h3')" title="Heading 3">H3</button>
  <div class="divider"></div>
  <button class="btn" onclick="execCmd('insertUnorderedList')" title="Bullet List">• List</button>
  <button class="btn" onclick="execCmd('insertOrderedList')" title="Numbered List">1. List</button>
  <button class="btn" onclick="execBlockquote()" title="Quote">” Quote</button>
  <button class="btn" onclick="execCode()" title="Code Block">&lt;/&gt;</button>
  <div class="divider"></div>
  <button class="btn" onclick="promptLink()" title="Insert Link">🔗 Link</button>
</div>

<div id="editor" class="editor-content" contenteditable="true" placeholder="Write your message here... You can type Markdown shortcuts like # Heading, **bold**, - list, or drag & drop images."></div>

<script>
  const editor = document.getElementById('editor');

  function execCmd(command, value = null) {
    document.execCommand(command, false, value);
    editor.focus();
  }

  function execHeading(tag) {
    document.execCommand('formatBlock', false, tag);
    editor.focus();
  }

  function execBlockquote() {
    document.execCommand('formatBlock', false, 'blockquote');
    editor.focus();
  }

  function execCode() {
    document.execCommand('formatBlock', false, 'pre');
    editor.focus();
  }

  function promptLink() {
    const url = prompt("Enter URL:", "https://");
    if (url) execCmd('createLink', url);
  }

  // Live Markdown shortcuts handler (Lexxy behavior)
  editor.addEventListener('keyup', function(e) {
    if (e.key === ' ' || e.key === 'Enter') {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;
      const range = selection.getRangeAt(0);
      const node = range.startContainer;
      
      if (node.nodeType === Node.TEXT_NODE) {
        const text = node.textContent;
        // # Heading 1
        if (text.startsWith('# ')) {
          node.textContent = text.slice(2);
          document.execCommand('formatBlock', false, 'h1');
        }
        // ## Heading 2
        else if (text.startsWith('## ')) {
          node.textContent = text.slice(3);
          document.execCommand('formatBlock', false, 'h2');
        }
        // - Bullet list
        else if (text.startsWith('- ') || text.startsWith('* ')) {
          node.textContent = text.slice(2);
          document.execCommand('insertUnorderedList', false, null);
        }
        // 1. Numbered list
        else if (text.startsWith('1. ')) {
          node.textContent = text.slice(3);
          document.execCommand('insertOrderedList', false, null);
        }
        // > Quote
        else if (text.startsWith('> ')) {
          node.textContent = text.slice(2);
          document.execCommand('formatBlock', false, 'blockquote');
        }
      }
    }
  });

  // Exported functions for Qt/QML
  window.getHtml = function() {
    return editor.innerHTML;
  };

  window.getText = function() {
    return editor.innerText;
  };

  window.setHtml = function(html) {
    editor.innerHTML = html;
  };

  window.focusEditor = function() {
    editor.focus();
  };
</script>

</body>
</html>
