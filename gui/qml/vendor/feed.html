<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The Feed, rendered as one HTML document inside a single WebEngineView (see
  FeedView.qml). Everything scrolls here — QtWebEngine only gives the page's own
  wheel handling, and the old per-card WebEngineViews each swallowed the wheel so
  the surrounding QML Flickable never scrolled. One page, one scroll surface.

  QML pushes state in through window.__set*() and reads it back through
  window.__state(); discrete actions leave through a `feed:` URL that FeedView's
  onNavigationRequested catches. Each newsletter body lives in its own same-origin
  <iframe srcdoc> so hostile email CSS can't leak into the card chrome; the iframe
  is sized to its content so it never scrolls, and a wheel listener inside it
  pushes the scroll up to this page.
-->
<style>
  :root {
    --bg:#1a1b26; --fg:#a9b1d6; --dim:#565f89; --accent:#7aa2f7;
    --card:#24283b; --cardhover:#2d3350; --hairline:#2a2e40; --sel:#292e42;
    --green:#9ece6a; --sheet:#1a1b26; --radius:8px;
  }
  * { box-sizing: border-box; }
  /* Horizontal clip stays on <html> only. Putting overflow-x on <body> makes
     it a scroll container that never scrolls, which disables position:sticky
     for the cards' feet (the real scroll surface is the viewport).
     scrollbar-gutter reserves the classic scrollbar's width on BOTH sides so
     the centred column lands on the true window centre — matching BucketView,
     which uses an overlay scrollbar that takes no layout width. */
  html { overflow-x:hidden; scrollbar-gutter:stable both-edges; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
  body { font-family:"JetBrainsMono Nerd Font", ui-monospace, SFMono-Regular, monospace; }
  body, .card, .card *, .divider *, .hdr *, .empty * {
    transition: background-color .22s ease, color .22s ease, border-color .22s ease;
  }

  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-thumb { background:var(--sel); border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }

  #wrap { width:min(880px, 100% - 80px); margin:0 auto; padding:56px 0 140px; }

  /* header — same shape as every bucket in BucketView. Glyph and title share a
     line-height so they sit at the same baseline the QML header does. */
  .hdr { display:flex; align-items:flex-start; gap:14px; }
  .glyph { font-family:"JetBrainsMono Nerd Font", monospace; font-size:30px; color:var(--accent); line-height:1.2; }
  .htext { flex:1; min-width:0; }
  .htitle { font-size:30px; font-weight:700; color:var(--fg); line-height:1.2; }
  .hstatus { font-size:12px; color:var(--dim); margin-top:4px; }
  .markall {
    align-self:center; font-family:inherit; font-size:11px; color:var(--dim);
    background:var(--sel); border:0; border-radius:14px; height:28px; padding:0 14px; cursor:pointer;
  }
  .markall:hover { background:var(--cardhover); }
  .hgap { height:28px; }

  /* cards */
  .card {
    position:relative; background:var(--card); border:1px solid var(--hairline);
    border-radius:var(--radius); padding:14px 14px 12px 16px; margin-bottom:6px;
  }
  .card.hl { background:var(--sel); border-color:var(--accent); }
  .bar {
    position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:2px;
    background:var(--accent); opacity:0;
  }
  .card.new .bar { opacity:1; }

  .hrow { display:flex; align-items:center; gap:14px; height:40px; cursor:pointer; }
  .avatar {
    flex:0 0 34px; width:34px; height:34px; border-radius:17px;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--bg);
  }
  .who { flex:1 1 auto; min-width:0; }
  .name { font-size:12px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.new .name { color:var(--fg); font-weight:600; }
  .subj {
    font-size:14px; font-weight:600; color:var(--fg); margin-top:3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .date { flex:0 0 auto; font-size:11px; color:var(--dim); }
  .chev { flex:0 0 auto; width:14px; text-align:right; font-size:12px; color:var(--dim);
          transition: transform .18s ease; }
  .card.open .chev { transform: rotate(90deg); }

  .sheet {
    margin-top:12px; position:relative; overflow:hidden;
    border:1px solid var(--hairline); border-radius:var(--radius); background:var(--sheet);
  }
  /* Collapsed, every card reserves the same body height whether it is still
     showing "Loading preview…", the text snippet, or a clipped iframe — so
     entering the Feed doesn't show a column of cards growing as bodies load in. */
  .bodyhost { height:200px; overflow:hidden; }
  .card.open .bodyhost { height:auto; }
  /* Hidden until DarkReader has re-tinted the article (see onIframeLoad) so a
     newsletter's own light backgrounds never flash before the invert. The
     .sheet behind it is already the themed colour, so the swap is seamless —
     no fade, which would just composite the light frame at partial opacity. */
  .bodyhost iframe { display:block; width:100%; border:0; visibility:hidden; }
  .bodyhost iframe.ready { visibility:visible; }
  .snippet {
    padding:16px; font-size:12px; line-height:1.45; color:var(--fg);
    white-space:pre-wrap;
  }
  /* The snippet is the collapsed preview only. Once a card is open the article
     iframe is what shows — hide the raw-text snippet so it can't flash in the
     gap before the iframe is built and re-tinted. The dark .sheet fills the
     gap instead. */
  .card.open .snippet { display:none; }
  .fade {
    position:absolute; left:0; right:0; bottom:0; height:96px; pointer-events:none;
    background:linear-gradient(rgba(0,0,0,0), var(--sheet)); transition:opacity .2s ease;
  }
  .card.open .fade { opacity:0; }

  .foot { display:flex; gap:10px; margin-top:12px; }
  /* While the card is open its foot rides the bottom of the viewport, so the
     "Read less" control is always in reach without scrolling down to the end
     of a long article. It only detaches (scrolls away) once you scroll past
     the whole card. */
  .card.open .foot {
    position:sticky; bottom:0; z-index:3;
    margin:12px -14px -12px -16px; padding:12px 14px 12px 16px;
    background:var(--card); border-top:1px solid var(--hairline);
    border-radius:0 0 var(--radius) var(--radius);
  }
  .chip {
    font-family:inherit; font-size:10px; color:var(--dim); background:var(--sel);
    border:0; border-radius:12px; height:24px; padding:0 11px; cursor:pointer;
  }
  .chip:hover { background:var(--cardhover); }
  .chip.chip-trash:hover { background:#c0392b; color:#fff; }

  /* dividers — the "you got to here" rule from FeedDivider.qml */
  .divider { display:flex; align-items:center; gap:12px; height:34px; }
  .dline { flex:1; height:1px; background:var(--accent); opacity:.5; }
  .dtag { font-size:9px; font-weight:600; letter-spacing:1.5px; color:var(--accent); }

  .empty { text-align:center; padding-top:70px; color:var(--dim); font-size:12px; }
  .emptybig { font-size:32px; color:var(--hairline); margin-bottom:10px; }
</style>
</head>
<body>
<div id="wrap"></div>
<script>
(function () {
  "use strict";

  var WRAP = document.getElementById("wrap");
  var DATA = { rows: [], newCount: 0, header: {} };
  var BODIES = {};          // id -> { html, text }
  var HI = -1;
  var LAST_MARK = "";
  var DR = "";              // Dark Reader source, handed in by QML
  var THEME = { dark: true };

  // ---------- inbound from QML ----------
  window.__setDrLib = function (src) { DR = src || ""; };

  window.__setTheme = function (t) {
    THEME = t || { dark: true };
    var s = document.documentElement.style;
    var m = {
      "--bg": t.bg, "--fg": t.fg, "--dim": t.dim, "--accent": t.accent,
      "--card": t.card, "--cardhover": t.cardHover, "--hairline": t.hairline,
      "--sel": t.sel, "--green": t.green, "--sheet": t.sheet
    };
    for (var k in m) if (m[k]) s.setProperty(k, m[k]);
    if (t.radius) s.setProperty("--radius", t.radius + "px");
    rebuildIframes();
  };

  window.__setData = function (d) {
    DATA = d || { rows: [], newCount: 0, header: {} };
    if (HI >= DATA.rows.length) HI = DATA.rows.length - 1;
    render();
  };

  window.__setBody = function (id, rec) {
    BODIES[id] = rec || {};
    var card = cardById(id);
    if (!card) return;
    fillSnippet(card);
    if (card.classList.contains("near")) ensureIframe(card);
  };

  window.__move = function (dir) {
    if (!DATA.rows.length) return;
    HI = Math.max(0, Math.min(DATA.rows.length - 1, (HI < 0 ? 0 : HI) + dir));
    applyHi();
    var card = cardAt(HI);
    if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
  };

  window.__toggleHi = function () {
    var card = cardAt(HI);
    if (card) toggleCard(card);
  };

  window.__collapseAll = function () {
    var open = WRAP.querySelectorAll(".card.open");
    for (var i = 0; i < open.length; i++) setOpen(open[i], false);
  };

  window.__openFullHi = function () {
    if (HI >= 0 && HI < DATA.rows.length)
      location.href = "feed:openfull/" + encodeURIComponent(DATA.rows[HI].id);
  };

  window.__state = function () {
    var open = [];
    var oc = WRAP.querySelectorAll(".card.open");
    for (var i = 0; i < oc.length; i++) open.push(oc[i].dataset.id);
    return {
      anyOpen: open.length > 0,
      open: open,
      mark: LAST_MARK,
      hi: HI,
      scrollY: window.scrollY || 0
    };
  };

  // Put the page back the way __state() last saw it, after QML has torn the
  // WebEngineView down and rebuilt it to shake off a stale black surface.
  window.__restore = function (st) {
    st = st || {};
    HI = (typeof st.hi === "number") ? st.hi : HI;
    applyHi();
    var ids = st.open || [];
    for (var i = 0; i < ids.length; i++) {
      var card = cardById(ids[i]);
      if (card && !card.classList.contains("open")) setOpen(card, true);
    }
    var y = st.scrollY || 0;
    if (y > 1) {
      var n = 0, iv = setInterval(function () {
        window.scrollTo(0, y);
        if (++n > 16) clearInterval(iv);
      }, 60);
    }
  };

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function cardAt(i) { return WRAP.querySelector('.card[data-idx="' + i + '"]'); }
  function cardById(id) {
    var cards = WRAP.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) if (cards[i].dataset.id === id) return cards[i];
    return null;
  }

  // ---------- render ----------
  function render() {
    var rows = DATA.rows || [];
    var h = DATA.header || {};
    var out = '<div class="hdr"><div class="glyph">' + esc(h.glyph || "") + '</div>' +
              '<div class="htext"><div class="htitle">' + esc(h.title || "The Feed") + '</div>' +
              '<div class="hstatus">' + esc(h.status || "") + '</div></div>';
    if (DATA.newCount > 0)
      out += '<button class="markall" onclick="location.href=\'feed:markall\'">Mark all read</button>';
    out += '</div><div class="hgap"></div>';

    if (!rows.length) {
      out += '<div class="empty"><div class="emptybig">✉</div><div>The Feed is empty</div></div>';
      WRAP.innerHTML = out;
      return;
    }

    // The rule marks where the reader left off: below it is everything already
    // seen, above it everything since. With nothing new it sits at the very top.
    if (DATA.newCount === 0) out += divider("you are all caught up");
    for (var i = 0; i < rows.length; i++) {
      out += cardHtml(rows[i], i, i < DATA.newCount);
      if (DATA.newCount > 0 && DATA.newCount < rows.length && i === DATA.newCount - 1)
        out += divider("you got to here last time");
    }
    WRAP.innerHTML = out;

    var cards = WRAP.querySelectorAll(".card");
    for (var j = 0; j < cards.length; j++) wireCard(cards[j]);
    applyHi();
  }

  function cardHtml(row, idx, isNew) {
    return '<div class="card' + (isNew ? " new" : "") + '" data-id="' + esc(row.id) +
             '" data-idx="' + idx + '" data-date="' + esc(row.dateRaw || "") + '">' +
           '<div class="bar"></div>' +
           '<div class="hrow">' +
             '<div class="avatar" style="background:' + esc(row.avatarColor || "#888") + '">' +
               esc(row.initials || "?") + '</div>' +
             '<div class="who"><div class="name">' + esc(row.fromName || row.fromAddr || "") + '</div>' +
               '<div class="subj">' + esc(row.subject || "(no subject)") + '</div></div>' +
             '<div class="date">' + esc(row.date || "") + '</div>' +
             '<div class="chev">▸</div>' +
           '</div>' +
           '<div class="sheet"><div class="bodyhost"><div class="snippet"></div></div>' +
             '<div class="fade"></div></div>' +
           '<div class="foot">' +
             '<button class="chip chip-more">Read more ▾</button>' +
             '<button class="chip chip-open">Open full page ↗</button>' +
             '<button class="chip chip-trash">Trash ✕</button>' +
           '</div></div>';
  }

  function divider(label) {
    return '<div class="divider"><span class="dline"></span><span class="dtag">' +
           esc(label.toUpperCase()) + '</span><span class="dline"></span></div>';
  }

  function wireCard(card) {
    observer.observe(card);
    card.querySelector(".hrow").addEventListener("click", function () { toggleCard(card); });
    card.querySelector(".chip-more").addEventListener("click", function (e) {
      e.stopPropagation(); toggleCard(card);
    });
    card.querySelector(".chip-open").addEventListener("click", function (e) {
      e.stopPropagation();
      location.href = "feed:openfull/" + encodeURIComponent(card.dataset.id);
    });
    card.querySelector(".chip-trash").addEventListener("click", function (e) {
      e.stopPropagation();
      location.href = "feed:trash/" + encodeURIComponent(card.dataset.id);
    });
    fillSnippet(card);
  }

  function fillSnippet(card) {
    var el = card.querySelector(".snippet");
    if (!el) return;
    var b = BODIES[card.dataset.id];
    if (b && b.text) el.textContent = b.text.replace(/\s+/g, " ").trim().slice(0, 240);
    else if (b) el.textContent = "";
    else el.textContent = "Loading preview…";
  }

  // ---------- the article iframe ----------
  function bodyDoc(row, b) {
    var dark = !!THEME.dark;
    var bg = dark ? (THEME.sheet || "#1a1b26") : "#ffffff";
    var fg = dark ? (THEME.fg || "#a9b1d6") : "#1b1b1b";
    // Drop any <meta> the source carried in its own <head>: the wrapper doc
    // already sets charset / viewport / color-scheme, and newsletter HTML
    // routinely ships `content="width=device-width; initial-scale=1"` — the
    // ';' makes Chromium log a parse warning on every card. Stripping them
    // also kills http-equiv refresh redirects and stray CSP from the body.
    var article = (b && b.html && b.html.length)
      ? b.html.replace(/<meta\b[^>]*>/gi, "")
      : '<pre style="white-space:pre-wrap;font-family:inherit;font-size:14px">' +
        esc(b && b.text ? b.text : "(this message has no text part)") + "</pre>";
    // DarkReader overrides an element's colour via a stylesheet rule, which the
    // cascade ranks *below* an inline `style="…!important"` on that element — so
    // a newsletter (or the unbox.at catch-all banner) that hard-codes a light
    // `background-color:#fff !important` inline stays light forever. Drop
    // !important from inline background/colour decls only (layout !important is
    // left alone) so the dark theme can take hold. Both quote styles.
    if (dark)
      article = article.replace(/\sstyle=(["'])([\s\S]*?)\1/gi, function (m, q, decls) {
        return " style=" + q + decls.replace(
          /((?:^|;)\s*(?:background-color|background|color)\s*:[^;]*?)\s*!\s*important/gi,
          "$1") + q;
      });
    var css =
      "html,body{margin:0!important;padding:0!important;background:" + bg + "!important;color:" + fg + ";" +
        "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" +
        "font-size:14px;line-height:1.6;overflow:hidden!important;" +
        "word-wrap:break-word;overflow-wrap:break-word;}" +
      "*{max-width:100%!important;box-sizing:border-box!important;}" +
      "img{max-width:100%!important;height:auto!important;}" +
      "table{table-layout:fixed!important;width:100%!important;max-width:100%!important;}" +
      "td,th{overflow-wrap:break-word;word-break:break-word;}" +
      "pre{white-space:pre-wrap!important;word-break:break-word;}" +
      "a{color:" + (THEME.accent || "#7aa2f7") + ";}";
    return '<!DOCTYPE html><html><head><meta charset="utf-8">' +
           '<meta name="viewport" content="width=device-width,initial-scale=1">' +
           '<meta name="color-scheme" content="' + (dark ? "dark" : "light") + '">' +
           "<style>" + css + "</style></head><body><div id=\"__mb\">" +
           article + "</div></body></html>";
  }

  function ensureIframe(card) {
    var b = BODIES[card.dataset.id];
    if (!b) return;
    var host = card.querySelector(".bodyhost");
    if (!host || host.dataset.built === "1") return;
    host.dataset.built = "1";
    var row = DATA.rows[+card.dataset.idx] || {};
    var f = document.createElement("iframe");
    f.setAttribute("scrolling", "no");
    f.addEventListener("load", function () { onIframeLoad(card, f); });
    f.srcdoc = bodyDoc(row, b);
    host.innerHTML = "";
    host.appendChild(f);
  }

  function onIframeLoad(card, f) {
    var w = f.contentWindow, d = f.contentDocument;
    // Dark Reader, per iframe — same call ReadingView/the old FeedArticle made,
    // just injected after load so the 340 KB source lives once in this page.
    var darkening = false;
    try {
      if (THEME.dark && DR && d) {
        darkening = true;
        var s1 = d.createElement("script"); s1.textContent = DR; d.head.appendChild(s1);
        var s2 = d.createElement("script");
        // immediateModify: run the full re-tint synchronously inside enable().
        // Without it DarkReader sees this still-hidden iframe as "not visible"
        // and defers the dynamic pass until after we've revealed it — which is
        // the white-then-dark flash. With it, the iframe is already fully dark
        // by the time onIframeLoad returns.
        s2.textContent = "try{DarkReader.enable(" + JSON.stringify({
          mode: 1, brightness: 100, contrast: 90, sepia: 0, immediateModify: true,
          darkSchemeBackgroundColor: THEME.sheet, darkSchemeTextColor: THEME.fg,
          selectionColor: THEME.sel
        }) + ");}catch(e){}";
        d.head.appendChild(s2);
      }
    } catch (e) {}

    // Show the iframe only once DarkReader's (synchronous) restyle has had a
    // paint — two rAFs inside the iframe, with a timeout as a hard floor so it
    // can never stay invisible. Nothing to wait for when not darkening.
    var reveal = function () { f.classList.add("ready"); };
    if (darkening && w && w.requestAnimationFrame) {
      w.requestAnimationFrame(function () { w.requestAnimationFrame(reveal); });
      setTimeout(reveal, 150);
    } else {
      reveal();
    }
    // The iframe has nothing to scroll; forward the wheel to this page so the
    // feed moves under the pointer instead of nothing happening.
    try {
      w.addEventListener("wheel", function (e) {
        window.scrollBy(0, e.deltaY);
        e.preventDefault();
      }, { passive: false });
    } catch (e) {}
    measure(card, f, 0);
  }

  function measure(card, f, n) {
    try {
      var d = f.contentDocument;
      if (d && d.body) {
        // Measure the wrapper div's own box — body/documentElement scrollHeight
        // never drop below the iframe's current height, so they'd pin a short
        // article to whatever height the iframe already had.
        var mb = d.getElementById("__mb");
        var hgt = mb ? Math.ceil(mb.getBoundingClientRect().height) : 0;
        // Marketing HTML that floats or absolutely-positions its top-level
        // content leaves the wrapper with a zero box; fall back to the doc's
        // own scroll extents so the card still opens to full height.
        if (!hgt)
          hgt = Math.max(d.body.scrollHeight, d.body.offsetHeight,
                         d.documentElement ? d.documentElement.scrollHeight : 0);
        if (hgt > 0) {
          f.style.height = hgt + "px";
          card.classList.toggle("short", hgt <= 360);
        }
      }
    } catch (e) {}
    if (n < 12) setTimeout(function () { measure(card, f, n + 1); }, 300);
  }

  function rebuildIframes() {
    var cards = WRAP.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i], host = card.querySelector(".bodyhost");
      if (host && host.dataset.built === "1") {
        host.dataset.built = "";
        card.classList.remove("short");
        host.innerHTML = '<div class="snippet"></div>';
        fillSnippet(card);
        if (card.classList.contains("near")) ensureIframe(card);
      }
    }
  }

  // ---------- open / highlight / watermark ----------
  function setOpen(card, open) {
    card.classList.toggle("open", open);
    var more = card.querySelector(".chip-more");
    if (more) more.textContent = open ? "Read less ▴" : "Read more ▾";
    if (open) {
      ensureIframe(card);
      var dr = card.dataset.date || "";
      if (dr && dr > LAST_MARK) LAST_MARK = dr;
      if (dr) location.href = "feed:mark/" + encodeURIComponent(dr);
    }
  }
  function toggleCard(card) { setOpen(card, !card.classList.contains("open")); }

  function applyHi() {
    var was = WRAP.querySelectorAll(".card.hl");
    for (var i = 0; i < was.length; i++) was[i].classList.remove("hl");
    var card = cardAt(HI);
    if (card) card.classList.add("hl");
  }

  // ---------- lazy build + scroll watermark ----------
  var observer = new IntersectionObserver(function (ents) {
    for (var i = 0; i < ents.length; i++) {
      var ent = ents[i];
      if (ent.isIntersecting || ent.intersectionRatio > 0) {
        ent.target.classList.add("near");
        ensureIframe(ent.target);
      }
    }
  }, { rootMargin: "1200px 0px 1600px 0px" });

  var tick = null;
  window.addEventListener("scroll", function () {
    if (tick) return;
    tick = setTimeout(function () {
      tick = null;
      var cards = WRAP.querySelectorAll(".card");
      for (var i = 0; i < cards.length; i++) {
        if (cards[i].getBoundingClientRect().bottom < 4) {
          var dr = cards[i].dataset.date || "";
          if (dr > LAST_MARK) LAST_MARK = dr;
        }
      }
    }, 150);
  }, { passive: true });
})();
</script>
</body>
</html>
